name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch: {}   # lets you trigger it manually (e.g. from a test branch)

env:
  PROJECT_ID: project-c9782021-0683-4eb3-88b
  REGION: asia-south1
  SERVICE: makemymock-backend
  AR_REPO: makemymock
  RUNTIME_SA: makemymock-run@project-c9782021-0683-4eb3-88b.iam.gserviceaccount.com
  IMAGE_HOST: asia-south1-docker.pkg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required to mint the GitHub OIDC token for WIF
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP (keyless, via WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$IMAGE_HOST" --quiet

      - name: Build & push image (tagged with the commit SHA)
        run: |
          IMAGE="$IMAGE_HOST/$PROJECT_ID/$AR_REPO/backend:$GITHUB_SHA"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          # Secrets are pulled from Secret Manager. Comment out PYQ_MONGO_URI
          # or BREVO_API_KEY below if setup-secrets.ps1 reported "skip" for them.
          SECRETS="MONGO_URI=MONGO_URI:latest"
          SECRETS="$SECRETS,JWT_SECRET_KEY=JWT_SECRET_KEY:latest"
          SECRETS="$SECRETS,JWT_REFRESH_SECRET_KEY=JWT_REFRESH_SECRET_KEY:latest"
          SECRETS="$SECRETS,SMTP_PASSWORD=SMTP_PASSWORD:latest"
          SECRETS="$SECRETS,BREVO_API_KEY=BREVO_API_KEY:latest"
          SECRETS="$SECRETS,PYQ_MONGO_URI=PYQ_MONGO_URI:latest"

          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --env-vars-file cloudrun.env.yaml \
            --set-secrets "$SECRETS" \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 --memory 512Mi \
            --min-instances 1 --max-instances 1 \
            --timeout 300

      - name: Show URL + health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format "value(status.url)")
          echo "Deployed: $URL"
          curl -fsS "$URL/health" && echo " -> health OK"
